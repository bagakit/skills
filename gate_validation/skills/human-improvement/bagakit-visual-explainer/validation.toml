version = 2

[[suite]]
id = "bagakit-visual-explainer-layout"
owner = "skills/human-improvement/bagakit-visual-explainer"
description = "Require the canonical installable layout for bagakit-visual-explainer."
default = true
proof_mode = "structural"
protects = ["bagakit-visual-explainer installable layout, discovery metadata, structured contract, frontdoor declaration, and validation registration"]
oracle = ["filesystem checks require the family index, public skill, UI metadata, structured explanation contract, frontdoor declaration, and owner-local validation"]
exercised_surface = ["skills/human-improvement/bagakit-visual-explainer runtime directory", "gate_validation/skills/human-improvement/bagakit-visual-explainer registration"]
proves = ["The visual-explainer runtime and discovery surfaces exist as one installable skill directory."]
does_not_prove = ["Layout does not prove explanation depth, visual quality, learner understanding, or stochastic Agent compliance."]
validation_class = "structure"
groups = ["skills", "human-improvement", "visual-explainer", "structure"]

[suite.runner]
kind = "fs"
required_dirs = [
  "skills/human-improvement",
  "skills/human-improvement/bagakit-visual-explainer",
  "skills/human-improvement/bagakit-visual-explainer/agents",
  "skills/human-improvement/bagakit-visual-explainer/references",
  "skills/human-improvement/bagakit-visual-explainer/scripts",
  "gate_validation/skills/human-improvement",
  "gate_validation/skills/human-improvement/bagakit-visual-explainer",
]
required_files = [
  "skills/human-improvement/README.md",
  "skills/human-improvement/bagakit-visual-explainer/SKILL.md",
  "skills/human-improvement/bagakit-visual-explainer/agents/openai.yaml",
  "skills/human-improvement/bagakit-visual-explainer/references/frontdoor-rule.toml",
  "skills/human-improvement/bagakit-visual-explainer/references/skill-cli.toml",
  "skills/human-improvement/bagakit-visual-explainer/references/visual-explanation-contract.toml",
  "skills/human-improvement/bagakit-visual-explainer/scripts/bagakit-visual-explainer-cli.sh",
  "gate_validation/skills/human-improvement/README.md",
  "gate_validation/skills/human-improvement/bagakit-visual-explainer/validation.toml",
  "gate_validation/skills/human-improvement/bagakit-visual-explainer/check-visual-explainer.ts",
]
forbidden_paths = [
  "skills/human-improvement/bagakit-visual-explainer/SKILL_PAYLOAD.json",
  "skills/human-improvement/bagakit-visual-explainer/README.md",
  "skills/human-improvement/bagakit-visual-explainer/assets",
  "skills/human-improvement/bagakit-visual-explainer/docs",
]

[[suite]]
id = "bagakit-visual-explainer-contract"
owner = "skills/human-improvement/bagakit-visual-explainer"
description = "Validate the structured visual-explanation stages, guards, and public boundaries."
default = true
proof_mode = "structural"
protects = ["visual-explainer stage order, language rule, architecture overview, coverage-before-compression, dedicated walkthrough, causal-depth guards, intentional style freedom, audience-derived tonality, semantic visuals, false-mastery boundary, and frontdoor alignment"]
oracle = ["Python standard-library TOML parsing checks typed contract identities, ordered stage ids, guard ids, frontdoor identity, family discovery, and the SKILL entrypoint link"]
exercised_surface = ["skills/human-improvement/bagakit-visual-explainer/references/visual-explanation-contract.toml", "skills/human-improvement/bagakit-visual-explainer/references/frontdoor-rule.toml", "skills/human-improvement/bagakit-visual-explainer/SKILL.md"]
proves = ["The published visual-explanation contract exposes the intended ordered workflow, adaptive coverage rules, style boundary, guards, ownership boundary, and discovery links."]
does_not_prove = ["Structured contract validation does not prove generated HTML quality, factual correctness, browser behavior, teaching effectiveness, or learner retention."]
timeout_seconds = 120
validation_class = "contract"
groups = ["skills", "human-improvement", "visual-explainer", "contract"]

[suite.runner]
kind = "executable"
command = "{node}"
args = [
  "--experimental-strip-types",
  "gate_validation/skills/human-improvement/bagakit-visual-explainer/check-visual-explainer.ts",
  "--root",
  "{repo_root}",
]
